[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlcoach"
version = "0.1.0"
description = "rlcoach (subset) embedded in RocketPrismas: analyzes player-vs-bot match recordings"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rlcoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
